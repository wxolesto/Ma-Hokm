:root{--f:'SF Pro Display','SF Arabic',-apple-system,Roboto,sans-serif;--fg:#f4fbf6;--muted:#a9cdb8;--gold:#ffd166;--glass:rgba(255,255,255,.12);--stroke:rgba(255,255,255,.22);--hi:rgba(255,255,255,.35);--ease:cubic-bezier(.22,.61,.36,1);--t1:#25895a;--t2:#115236;--t3:#08301f}
html[data-table=navy]{--t1:#2a6aa8;--t2:#133b66;--t3:#0a2140}
html[data-table=wine]{--t1:#a33a52;--t2:#661f33;--t3:#3a0f1d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--t3)}
body{color:var(--fg);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;transition:transform .2s var(--ease),opacity .25s,background-color .3s}button:active{transform:scale(.96)}
[hidden]{display:none!important}
.felt{position:fixed;inset:0;z-index:-1;background:radial-gradient(110% 80% at 50% 42%,var(--t1) 0%,var(--t2) 58%,var(--t3) 100%)}
.felt:after{content:"";position:absolute;inset:0;opacity:.18;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),repeating-linear-gradient(-45deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.06)),rgba(255,255,255,.06);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--stroke);box-shadow:0 10px 30px rgba(0,0,0,.28),inset 0 1px 0 var(--hi)}
.pill{height:50px;padding-inline:26px;border-radius:99px;background:linear-gradient(180deg,#ffe29a,var(--gold));color:#3a2800;font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.7)}
.pill.soft{background:rgba(255,255,255,.14);color:var(--fg);box-shadow:inset 0 1px 0 var(--hi);border:1px solid var(--stroke)}
.chip{height:34px;padding-inline:14px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;background:rgba(255,255,255,.12);border:1px solid var(--stroke)}.chip.on{background:var(--gold);color:#3a2800;border-color:transparent;font-weight:700}
.rb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}.rb svg{width:20px;height:20px}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.en{direction:ltr;unicode-bidi:isolate;font-family:'SF Pro Display',sans-serif}
/* home */
#home{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.ttl{font-size:92px;font-weight:700;line-height:1;text-shadow:0 6px 30px rgba(0,0,0,.4);margin:0}
.suits{font-size:34px;letter-spacing:.3em;direction:ltr;opacity:.95}.suits i{font-style:normal}.suits .r{color:#ff8a8a}
.hm{width:min(340px,100%);padding:18px;border-radius:30px;display:flex;flex-direction:column;gap:12px}.hm .pill{width:100%}
.stt{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.stt b{display:block;font-family:'SF Pro Display',sans-serif;font-size:22px}.stt small{color:var(--muted);font-size:11px}
/* game */
#game{position:fixed;inset:0;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom))}
.hud{display:flex;align-items:center;gap:8px}.hud .grow{flex:1;display:flex;justify-content:center;gap:8px}
.sc{display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:99px;font-size:13px}.sc b{font-family:'SF Pro Display',sans-serif;font-size:19px}.sc span{color:var(--muted)}
.tr{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;font-size:13px}.tr b{font-size:20px;line-height:1}.tr .red{color:#ff8a8a}
.tbl{flex:1;position:relative;min-height:0;margin:6px 0}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px}
.seat.s2{top:0;left:50%;transform:translateX(-50%)}.seat.s1{right:0;top:50%;transform:translateY(-58%)}.seat.s3{left:0;top:50%;transform:translateY(-58%)}
.pl{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:99px;font-size:12px;position:relative;transition:box-shadow .3s}
.pl.turn{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(255,209,102,.6)}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:rgba(255,255,255,.2)}
.pl.us .av{background:#4cc3ff;color:#06293b}.pl.them .av{background:#ff8fa3;color:#3d0a16}
.crown{position:absolute;top:-9px;inset-inline-end:-2px;font-size:13px}
.bks{position:relative;display:flex;direction:ltr;height:50px}.bks .cd{--cw:30px;position:relative;margin-inline-end:-20px}
.sd .bks{flex-direction:column;height:auto;width:34px;align-items:center}.sd .bks .cd{--cw:30px;margin:0 0 -48px}
.cnt{font-family:'SF Pro Display',sans-serif;font-size:12px;color:var(--muted)}
.trick{position:absolute;left:50%;top:50%;width:178px;height:190px;transform:translate(-50%,-50%)}
.tc{position:absolute}.tc.t0{left:50%;bottom:0;margin-left:-26px}.tc.t1{right:0;top:50%;margin-top:-37px}.tc.t2{left:50%;top:0;margin-left:-26px}.tc.t3{left:0;top:50%;margin-top:-37px}
.tc .cd{--cw:52px;will-change:transform}
@keyframes fly{from{transform:translate(var(--fx),var(--fy)) scale(.85) rotate(var(--fr,0deg));opacity:0}}
.trick.take0 .cd{animation:take0 .42s ease-in both}.trick.take1 .cd{animation:take1 .42s ease-in both}.trick.take2 .cd{animation:take2 .42s ease-in both}.trick.take3 .cd{animation:take3 .42s ease-in both}
@keyframes take0{to{transform:translate(0,170px) scale(.6);opacity:0}}@keyframes take1{to{transform:translate(150px,0) scale(.6);opacity:0}}@keyframes take2{to{transform:translate(0,-170px) scale(.6);opacity:0}}@keyframes take3{to{transform:translate(-150px,0) scale(.6);opacity:0}}
.say{min-height:22px;text-align:center;font-size:13px;color:var(--muted);margin-bottom:4px}.say.go{color:var(--gold);font-weight:600}
.hand{position:relative;height:112px;direction:ltr;margin-bottom:2px}
.hc{position:absolute;bottom:0;touch-action:none;transition:left .32s var(--ease),transform .22s var(--ease),filter .25s}.hc .cd{--cw:58px}.hc.sel{transform:translateY(-22px);z-index:60!important}.hc.dim{filter:brightness(.55)}.hc.hint .cd{box-shadow:0 0 0 3px var(--gold),0 0 18px rgba(255,209,102,.8)}
.hc.new{animation:deal .45s var(--ease) both;animation-delay:calc(var(--i)*35ms)}@keyframes deal{from{transform:translateY(80px);opacity:0}}
/* cards */
.cd{--cw:54px;width:var(--cw);height:calc(var(--cw)*1.44);border-radius:calc(var(--cw)*.14);background:#fbf8f0;color:#1b1b1f;position:relative;box-shadow:0 2px 7px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.07);font-family:'SF Pro Display',sans-serif;direction:ltr;flex:none}
.cd.red{color:#c8283a}.cd .r{position:absolute;left:11%;top:5%;font-weight:700;font-size:calc(var(--cw)*.36);line-height:1}.cd .m{position:absolute;left:11%;top:calc(var(--cw)*.42);font-size:calc(var(--cw)*.27);line-height:1}.cd .c{position:absolute;right:9%;bottom:4%;font-size:calc(var(--cw)*.6);line-height:1}
.cd.bk{background:repeating-linear-gradient(45deg,#1d4f7a 0 3px,#256393 3px 6px);border:2px solid #fbf8f0}
/* modal, toast */
#modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;animation:fi .25s both}@keyframes fi{from{opacity:0}}
.mb{width:min(380px,100%);max-height:88%;overflow:auto;border-radius:30px;padding:22px;display:flex;flex-direction:column;gap:14px;background:rgba(10,45,30,.9);animation:pop .35s var(--ease) both}@keyframes pop{from{transform:scale(.92) translateY(12px);opacity:0}}
.mb h2{margin:0;font-size:20px;text-align:center}.mb p{margin:0;color:var(--muted);font-size:14px;line-height:1.8}.mb .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.mb .row .pill{flex:1;padding-inline:14px}
.mh{display:flex;justify-content:center;gap:0;direction:ltr;height:calc(58*1.44px)}.mh .cd{--cw:46px;margin-inline-start:-14px}.mh .cd:first-child{margin:0}
.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sg button{height:76px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;background:rgba(255,255,255,.12);border:1px solid var(--stroke)}.sg b{font-size:30px;line-height:1.1}.sg .red{color:#ff8a8a}
.big{font-size:44px;font-weight:700;text-align:center;line-height:1.2}.kt{color:var(--gold)}
.toast{position:fixed;left:50%;top:max(70px,calc(env(safe-area-inset-top) + 60px));transform:translate(-50%,-10px);z-index:30;padding:10px 18px;border-radius:99px;background:rgba(0,0,0,.65);font-size:14px;opacity:0;pointer-events:none;transition:.3s;white-space:nowrap}.toast.on{opacity:1;transform:translate(-50%,0)}
.seg{display:flex;gap:8px;flex-wrap:wrap}.set{display:flex;flex-direction:column;gap:8px}.set label{font-size:13px;color:var(--muted)}
.shk{animation:shk .3s}@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sd .pl{flex-direction:column;padding:6px 8px;border-radius:18px;gap:3px;min-width:50px}.sd .crown{top:-10px;inset-inline-end:-6px}
.sd .av{width:30px;height:30px}
.sd .bks{margin-top:6px;height:auto;min-height:60px}.sd .pl{position:relative;z-index:2;font-size:11px}.s2 .pl{z-index:2}.s2 .bks{margin-top:2px}
.dots{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;font-size:12px}
.dl b{font-size:16px;font-weight:700;margin-inline-start:2px}.dl.us{color:#7dd3ff}.dl.them{color:#ff9fb2}
.dd{display:flex;gap:4px;direction:ltr}.dd i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.16);transition:background .3s,transform .3s}.dd i.us{background:#4cc3ff;transform:scale(1.15)}.dd i.them{background:#ff8fa3;transform:scale(1.15)}
.cr{width:15px;height:15px;stroke:var(--gold);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
.crown{display:block;line-height:0}
.tw{position:absolute;left:50%;top:-6px;transform:translateX(-50%);white-space:nowrap;padding:5px 14px;border-radius:99px;font-size:13px;font-weight:600;z-index:5;animation:pop .35s var(--ease) both}
.tw.us{background:rgba(76,195,255,.9);color:#05263a}.tw.them{background:rgba(255,143,163,.92);color:#3d0a16}
.tc.win0 .cd{box-shadow:0 0 0 3px #4cc3ff,0 0 22px rgba(76,195,255,.8)}.tc.win1 .cd{box-shadow:0 0 0 3px #ff8fa3,0 0 22px rgba(255,143,163,.8)}
.stt.two{grid-template-columns:repeat(2,1fr);max-width:220px;margin-inline:auto;width:100%}.stt.two b{font-size:34px}
</style>

<body>
<div class="felt"></div>
<main id="home"></main>
<section id="game" hidden>
  <header class="hud" id="hud"></header>
  <div class="dots" id="dots"></div>
  <div class="tbl" id="tbl"></div>
  <div class="say" id="say"></div>
  <div class="hand" id="hand"></div>
</section>
<div id="modal" hidden><div class="mb glass" id="mb"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='hokm.v1';
let ST={games:0,wins:0,rounds:0,rwins:0,kots:0,opts:{speed:1,target:7,table:'green',level:1}};
try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j){ST=Object.assign(ST,j);ST.opts=Object.assign({speed:1,target:7,table:'green',level:1},j.opts||{})}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
const SU=['S','H','C','D'],SYM={S:'♠',H:'♥',D:'♦',C:'♣'},SN={S:'پیک',H:'دل',D:'خشت',C:'گشنیز'},RED={H:1,D:1};
const RL=r=>({11:'J',12:'Q',13:'K',14:'A'})[r]||String(r);
const NAMES=['تو','آرمان','نیلوفر','کیان'];
const POOL=['آرمان','نیلوفر','کیان','سارا','رضا','مینا','پویا','نگار','امیر','هانیه','بردیا','الناز','سینا','مهسا','آرش','یاسمن','کاوه','نازنین','پدرام','شبنم','فرزاد','لیلا','بهراد','مریم'];
const CROWN='<svg class="cr" viewBox="0 0 24 24"><path d="M4 18h16M4.500 18L3.500 8l5 4L12 6l3.500 6 5-4-1 10"/></svg>';
const sleepRaw=ms=>new Promise(r=>setTimeout(r,ms));
const sleep=ms=>sleepRaw(ms*ST.opts.speed);
const rnd=n=>Math.floor(Math.random()*n);
let G=null,toastT=null;
const IC={x:'<path d="M6 6l12 12M18 6L6 18"/>',menu:'<circle cx="5.500" cy="12" r="1.200"/><circle cx="12" cy="12" r="1.200"/><circle cx="18.500" cy="12" r="1.200"/>',bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.500 10.900c.6.5 1 1.200 1 2.100h5c0-.9.4-1.600 1-2.100A6 6 0 0 0 12 3z"/>',back:'<path d="M3 12a9 9 0 1 0 3-6.700L3 8M3 3v5h5M12 8v4l3 2"/>'};
const svg=n=>'<svg viewBox="0 0 24 24">'+IC[n]+'</svg>';
document.documentElement.dataset.table=ST.opts.table;

function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),1700)}
function modal(html,bind){const m=$('#modal'),b=$('#mb');b.innerHTML=html;m.hidden=false;if(bind)bind(b)}
function closeModal(){$('#modal').hidden=true;$('#mb').innerHTML=''}

/* ---------- cards ---------- */
function cardH(c,cls){const red=RED[c.s]?' red':'';return '<div class="cd'+red+(cls?' '+cls:'')+'"><span class="r">'+RL(c.r)+'</span><span class="m">'+SYM[c.s]+'</span><span class="c">'+SYM[c.s]+'</span></div>'}
const backH='<div class="cd bk"></div>';
function deck(){const d=[];for(const s of SU)for(let r=2;r<=14;r++)d.push({s,r});for(let i=d.length-1;i>0;i--){const j=rnd(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}
const same=(a,b)=>a.s===b.s&&a.r===b.r;
function sortHand(h,tr){const order=SU.slice();if(tr){order.splice(order.indexOf(tr),1);order.unshift(tr)}h.sort((a,b)=>order.indexOf(a.s)-order.indexOf(b.s)||b.r-a.r)}
const legalFor=(h,trick)=>{if(!trick.length)return h.slice();const ls=trick[0].c.s,f=h.filter(c=>c.s===ls);return f.length?f:h.slice()};
function winnerOf(trick,tr){let b=trick[0];for(const p of trick.slice(1)){if(p.c.s===b.c.s){if(p.c.r>b.c.r)b=p}else if(p.c.s===tr)b=p}return b}

/* ---------- bot ---------- */
const LV=[['آسان',0],['متوسط',1],['سخت',2],['حرفه‌ای',3]];
function botTrump(h){let best=null,bs=-1;for(const s of SU){const L=h.filter(c=>c.s===s);const sc=L.length*10+L.reduce((a,c)=>a+c.r,0)/4;if(sc>bs){bs=sc;best=s}}return best}
function uHigh(S,c,h){let n=0;for(let r=c.r+1;r<=14;r++){if(!S.pm[c.s+r]&&!h.some(p=>p.s===c.s&&p.r===r))n++}return n}
function uSuit(S,s,h){let n=0;for(let r=2;r<=14;r++){if(!S.pm[s+r]&&!h.some(p=>p.s===s&&p.r===r))n++}return n}
function pol(S,seat){
  const h=S.hands[seat],tr=S.trump,trick=S.trick,legal=legalFor(h,trick);
  if(legal.length===1)return legal[0];
  const asc=(a,b)=>a.r-b.r,partner=(seat+2)%4;
  if(!trick.length){
    const nt=legal.filter(c=>c.s!==tr);
    const m=nt.filter(c=>uHigh(S,c,h)===0).sort((a,b)=>b.r-a.r);
    if(m.length)return m[0];
    const tl=legal.filter(c=>c.s===tr).sort((a,b)=>b.r-a.r);
    if(tl.length&&uSuit(S,tr,h)>0&&uHigh(S,tl[0],h)===0&&(seat===S.hakem||tl.length>=3))return tl[0];
    if(nt.length){const cnt={};nt.forEach(c=>cnt[c.s]=(cnt[c.s]||0)+1);nt.sort((a,b)=>cnt[b.s]-cnt[a.s]||a.r-b.r);return nt[0]}
    return tl[tl.length-1];
  }
  const cur=winnerOf(trick,tr),pw=cur.s===partner,last=trick.length===3,ls=trick[0].c.s;
  if(h.some(c=>c.s===ls)){
    const mine=legal.slice().sort(asc);
    if(pw)return mine[0];
    if(cur.c.s===tr&&ls!==tr)return mine[0];
    const beat=mine.filter(c=>c.r>cur.c.r);
    if(!beat.length)return mine[0];
    if(last)return beat[0];
    const top=beat[beat.length-1];
    return uHigh(S,top,h)===0?top:beat[0];
  }
  const trs=h.filter(c=>c.s===tr).sort(asc),nts=h.filter(c=>c.s!==tr);
  const dis=()=>{if(!nts.length)return trs[0];const cnt={};nts.forEach(c=>cnt[c.s]=(cnt[c.s]||0)+1);nts.sort((a,b)=>cnt[a.s]-cnt[b.s]||a.r-b.r);return nts[0]};
  if(pw)return dis();
  if(trs.length){
    if(cur.c.s===tr){const hi=trs.filter(c=>c.r>cur.c.r);return hi.length?hi[0]:dis()}
    return trs[0];
  }
  return dis();
}
function liveS(){const R=G.R;return{hands:R.hands,trick:R.trick,trump:R.trump,pm:R.pm,hakem:G.hakem}}
function rollout(S,leader){
  const out=[0,0];let ld=leader;
  for(;;){
    if(!S.hands[0].length&&!S.hands[1].length&&!S.hands[2].length&&!S.hands[3].length)break;
    const seat=S.trick.length?(S.trick[S.trick.length-1].s+1)%4:ld;
    if(!S.hands[seat].length)break;
    const c=pol(S,seat),h=S.hands[seat];h.splice(h.findIndex(x=>x.s===c.s&&x.r===c.r),1);
    S.trick.push({s:seat,c});S.pm[c.s+c.r]=1;
    if(S.trick.length===4){const w=winnerOf(S.trick,S.trump).s;out[w%2]++;S.trick=[];ld=w}
  }
  return out;
}
function determinize(me){
  const R=G.R,own=R.hands[me],pool=[];
  for(const s of SU)for(let r=2;r<=14;r++){if(!R.pm[s+r]&&!own.some(c=>c.s===s&&c.r===r))pool.push({s,r})}
  const others=[0,1,2,3].filter(x=>x!==me).sort((x,y)=>Object.keys(R.voids[y]).length-Object.keys(R.voids[x]).length);
  for(let att=0;att<40;att++){
    for(let i=pool.length-1;i>0;i--){const j=rnd(i+1);[pool[i],pool[j]]=[pool[j],pool[i]]}
    const used=new Array(pool.length).fill(false),out={};let ok=true;
    for(const x of others){const need=R.hands[x].length;out[x]=[];for(let i=0;i<pool.length&&out[x].length<need;i++){if(!used[i]&&!R.voids[x][pool[i].s]){used[i]=true;out[x].push(pool[i])}}if(out[x].length<need){ok=false;break}}
    if(ok)return out;
  }
  const out={};let k=0;for(const x of others){out[x]=pool.slice(k,k+R.hands[x].length);k+=R.hands[x].length}return out;
}
async function mcPlay(seat,budget,g){
  const R=G.R,h=R.hands[seat],legal=legalFor(h,R.trick);if(legal.length===1)return legal[0];
  const team=seat%2,sc=legal.map(()=>0);let n=0,t0=performance.now(),lt=t0;
  while(n<10||performance.now()-t0<budget){
    const dh=determinize(seat);
    legal.forEach((c,i)=>{
      const hands=[0,1,2,3].map(x=>x===seat?h.filter(y=>!(y.s===c.s&&y.r===c.r)):dh[x].slice());
      const S={hands,trick:R.trick.concat([{s:seat,c}]),trump:R.trump,pm:Object.assign({},R.pm),hakem:G.hakem};S.pm[c.s+c.r]=1;
      let ld=R.leader,tw=[R.tricks[0],R.tricks[1]];
      if(S.trick.length===4){const w=winnerOf(S.trick,S.trump).s;tw[w%2]++;S.trick=[];ld=w}
      const o=rollout(S,ld),tot=tw[team]+o[team];
      sc[i]+=(tot>=7?1:0)+.04*tot;
    });
    n++;
    if(performance.now()-lt>35){await sleepRaw(0);lt=performance.now();if(G!==g)return legal[0]}
    if(n>4000)break;
  }
  let bi=0;for(let i=1;i<sc.length;i++)if(sc[i]>sc[bi])bi=i;return legal[bi];
}
async function botChoose(seat,g){
  const lv=ST.opts.level,legal=legalFor(G.R.hands[seat],G.R.trick);
  if(legal.length===1)return legal[0];
  if(lv===0){if(Math.random()<.4)return legal[rnd(legal.length)];return pol(liveS(),seat)}
  if(lv===1)return pol(liveS(),seat);
  return mcPlay(seat,lv===2?450:1400,g);
}
/* ---------- game flow ---------- */
function newGame(){
  closeModal();$('#home').hidden=true;$('#game').hidden=false;
  const pl=POOL.slice().sort(()=>Math.random()-.5);NAMES[1]=pl[0];NAMES[2]=pl[1];NAMES[3]=pl[2];
  G={score:[0,0],hakem:rnd(4),R:null,pick:null};startRound(G);
}
async function startRound(g){
  const dk=deck(),R=g.R={hands:[0,1,2,3].map(()=>dk.splice(0,5)),dk,trump:null,trick:[],tricks:[0,0],wins:[],pm:{},voids:[{},{},{},{}],leader:g.hakem,played:[],last:null,sel:null,hint:null,turn:null,resolve:null};
  R.hands.forEach(h=>sortHand(h));
  buildTable();renderAll();say(NAMES[g.hakem]==='تو'?'تو حاکمی':'حاکم: '+NAMES[g.hakem]);
  await sleep(700);if(G!==g)return;
  let tr;
  if(g.hakem===0)tr=await humanTrump();else{await sleep(900);tr=botTrump(R.hands[g.hakem])}
  if(G!==g)return;
  R.trump=tr;toast('حکم: '+SN[tr]+' '+SYM[tr]);
  R.hands.forEach(h=>{h.push(...dk.splice(0,8));sortHand(h,tr)});
  renderAll(true);await sleep(900);if(G!==g)return;
  playTricks(g);
}
function humanTrump(){
  return new Promise(res=>{const h=G.R.hands[0];
    modal('<h2>حکم را انتخاب کن</h2><div class="mh">'+h.map(c=>cardH(c)).join('')+'</div><div class="sg">'+SU.map(s=>'<button data-s="'+s+'"><b class="'+(RED[s]?'red':'')+'">'+SYM[s]+'</b>'+SN[s]+'</button>').join('')+'</div>',b=>{
      $$('[data-s]',b).forEach(x=>x.onclick=()=>{closeModal();res(x.dataset.s)})})});
}
async function playTricks(g){
  const R=g.R;let leader=g.hakem;
  for(let t=0;t<13;t++){
    R.trick=[];R.leader=leader;$('#tbl .trick').className='trick';$('#tbl .trick').innerHTML='';
    for(let k=0;k<4;k++){
      const seat=(leader+k)%4;R.turn=seat;renderSeats();
      let c,from=null;
      if(seat===0){R.sel=null;R.hint=null;renderHand();say('نوبت توست',1);const pr=await new Promise(r=>R.resolve=r);R.resolve=null;say('');c=pr.c;from=pr.rect}
      else{say('');const t0=performance.now();c=await botChoose(seat,g);if(G!==g)return;const w=(450+rnd(300))*ST.opts.speed-(performance.now()-t0);if(w>0)await sleepRaw(w);if(G!==g)return}
      if(G!==g)return;
      const dur=doPlay(seat,c,from);await sleepRaw(dur*.85);if(G!==g)return;
    }
    R.turn=null;renderSeats();
    const w=winnerOf(R.trick,R.trump).s;R.tricks[w%2]++;R.wins.push(w%2);R.last=R.trick.slice();renderHud();
    const tk=$('#tbl .trick'),wc=$('.tc.t'+w,tk);if(wc)wc.classList.add('win'+(w%2));const lb=document.createElement('div');lb.className='tw '+(w%2?'them':'us');lb.textContent=w%2?'مال اونا':'مال ما';tk.appendChild(lb);
    await sleep(1000);if(G!==g)return;lb.remove();
    $('#tbl .trick').classList.add('take'+w);await sleep(430);if(G!==g)return;
    leader=w;
  }
  endRound(g);
}
function doPlay(seat,c,from){
  const R=G.R,h=R.hands[seat],i=h.findIndex(x=>same(x,c));if(i>=0)h.splice(i,1);
  if(R.trick.length&&c.s!==R.trick[0].c.s)R.voids[seat][R.trick[0].c.s]=1;
  R.trick.push({s:seat,c});R.played.push(c);R.pm[c.s+c.r]=1;
  const d=document.createElement('div');d.className='tc t'+seat;d.innerHTML=cardH(c);$('#tbl .trick').appendChild(d);
  const cd=d.firstChild,to=d.getBoundingClientRect(),rf=rnd(24)-12;
  let fr=from;if(!fr){const e=$('#st'+seat+' .bks')||$('#st'+seat);fr=e?e.getBoundingClientRect():{left:to.left,top:to.top,width:to.width,height:to.height}}
  const dx=fr.left+fr.width/2-(to.left+to.width/2),dy=fr.top+fr.height/2-(to.top+to.height/2),s0=Math.max(.4,Math.min(1.3,(seat===0?fr.width:30)/to.width));
  const dur=Math.round(520*Math.min(1.2,Math.max(.7,ST.opts.speed)));
  const r0=seat===0?(from?rf*2:rnd(30)-15):(seat===1?35:seat===3?-35:rnd(20)-10);
  try{const an=cd.animate([{transform:'translate('+dx+'px,'+dy+'px) scale('+s0+') rotate('+r0+'deg)',offset:0},{transform:'translate('+dx*.1+'px,'+(dy*.1-6)+'px) scale(1.16) rotate('+rf*1.5+'deg)',offset:.72,easing:'ease-out'},{transform:'translate(0,0) scale(1) rotate('+rf+'deg)',offset:1}],{duration:dur,easing:'cubic-bezier(.2,.85,.3,1)',fill:'both'});
    an.onfinish=()=>{cd.style.transform='rotate('+rf+'deg)';an.cancel()}}catch(e){cd.style.transform='rotate('+rf+'deg)'}
  try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}
  renderHand();renderSeats();return dur;
}
function endRound(g){
  const R=g.R,wt=R.tricks[0]>=7?0:1,ht=g.hakem%2,kot=R.tricks[wt]===13,pts=kot?(wt!==ht?3:2):1;
  g.score[wt]+=pts;ST.rounds++;if(wt===0)ST.rwins++;if(kot&&wt===0)ST.kots++;
  const nh=wt===ht?g.hakem:(g.hakem+1)%4,over=g.score[wt]>=ST.opts.target;
  if(over){ST.games++;if(wt===0)ST.wins++}save();renderHud();
  const msg=(wt===0?'این دست را بردید':'این دست را باختید');
  modal('<div class="big'+(kot?' kt':'')+'">'+(kot?'کُت!':(wt===0?'بردید 🎉':'باختید'))+'</div><p style="text-align:center">'+msg+' · دست‌ها: <b class="en">'+R.tricks[0]+' - '+R.tricks[1]+'</b>'+(pts>1?'<br>امتیاز '+(kot&&wt!==ht?'کُتِ حاکم ':'')+'<b class="en">+'+pts+'</b>':'')+'</p><div class="stt two"><div><b>'+g.score[0]+'</b><small>ما</small></div><div><b>'+g.score[1]+'</b><small>اونا</small></div></div>'
   +(over?'<div class="big" style="font-size:30px">'+(wt===0?'برنده‌ی بازی شدید!':'این بازی را باختید')+'</div><div class="row"><button class="pill" id="m_new">بازی تازه</button><button class="pill soft" id="m_home">خانه</button></div>'
         :'<p style="text-align:center">دست بعد حاکم: <b>'+NAMES[nh]+'</b></p><div class="row"><button class="pill" id="m_go">دست بعدی</button></div>'),b=>{
    const go=$('#m_go',b);if(go)go.onclick=()=>{closeModal();g.hakem=nh;startRound(g)};
    const n=$('#m_new',b);if(n)n.onclick=newGame;const hm=$('#m_home',b);if(hm)hm.onclick=goHome;
  });
}

/* ---------- render ---------- */
function buildTable(){
  $('#tbl').innerHTML='<div class="seat s2" id="st2"></div><div class="seat s1 sd" id="st1"></div><div class="seat s3 sd" id="st3"></div><div class="trick" id="trk"></div>';
  $('#hud').innerHTML='<button class="rb glass" id="b_menu" aria-label="menu">'+svg('menu')+'</button><div class="grow"><div class="sc glass"><span>ما</span><b id="h_s0">0</b><span>·</span><b id="h_s1">0</b><span>اونا</span></div><div class="tr glass" id="h_tr"></div></div><button class="rb glass" id="b_hint" aria-label="hint">'+svg('bulb')+'</button><button class="rb glass" id="b_last" aria-label="last">'+svg('back')+'</button>';
  $('#b_menu').onclick=menu;$('#b_hint').onclick=hint;$('#b_last').onclick=lastTrick;
}
function renderAll(deal){renderHud();renderSeats();renderHand(deal)}
function renderHud(){
  const R=G.R;$('#h_s0').textContent=G.score[0];$('#h_s1').textContent=G.score[1];
  $('#h_tr').innerHTML=(R.trump?'<b class="'+(RED[R.trump]?'red':'')+'">'+SYM[R.trump]+'</b>':'<span>حکم؟</span>');
  $('#dots').innerHTML='<span class="dl us">ما <b>'+R.tricks[0]+'</b></span><div class="dd">'+[...Array(13)].map((_,i)=>'<i class="'+(R.wins[i]===0?'us':R.wins[i]===1?'them':'')+'"></i>').join('')+'</div><span class="dl them">اونا <b>'+R.tricks[1]+'</b></span>';
}
function seatH(s){
  const R=G.R,n=R.hands[s].length,team=s%2?'them':'us';
  const pl='<div class="pl glass '+team+(R.turn===s?' turn':'')+'"><span class="av">'+esc(NAMES[s].slice(0,1))+'</span>'+esc(NAMES[s])+(G.hakem===s?'<span class="crown">'+CROWN+'</span>':'')+'</div>';
  const bk=[];const show=s===2?Math.min(n,13):Math.min(n,5);for(let i=0;i<show;i++)bk.push(backH);
  return pl+'<div class="bks">'+bk.join('')+'</div><div class="cnt">'+n+'</div>';
}
function renderSeats(){[1,2,3].forEach(s=>{const e=$('#st'+s);if(e)e.innerHTML=seatH(s)})}
function renderHand(deal){
  const R=G.R,h=R.hands[0],el=$('#hand');if(!el)return;
  const W=el.clientWidth||340,cw=58,step=h.length>1?Math.min(cw*.9,(W-cw)/(h.length-1)):0,total=step*(h.length-1)+cw,x0=(W-total)/2;
  const my=R.resolve&&R.turn===0,legal=my?legalFor(h,R.trick):[],have={},keep={};
  $$('.hc',el).forEach(b=>have[b.dataset.k]=b);
  h.forEach((c,i)=>{const k=c.s+c.r;keep[k]=1;let b=have[k];
    if(!b){b=document.createElement('button');b.className='hc'+(deal?' new':'');b.dataset.k=k;b.innerHTML=cardH(c);el.appendChild(b)}
    b.style.setProperty('--i',i);b.style.left=(x0+i*step)+'px';
    const sel=R.sel&&same(R.sel,c);b.style.zIndex=sel?60:i;
    b.classList.toggle('sel',!!sel);b.classList.toggle('dim',my&&!legal.some(x=>same(x,c)));b.classList.toggle('hint',!!(R.hint&&same(R.hint,c)))});
  Object.keys(have).forEach(k=>{if(!keep[k])have[k].remove()});
}
function say(t,go){const e=$('#say');e.textContent=t;e.classList.toggle('go',!!go)}
function tryPlay(b,fromRect){
  const R=G&&G.R;if(!R||!R.resolve||R.turn!==0)return false;
  const k=b.dataset.k,c=R.hands[0].find(x=>x.s+x.r===k);if(!c)return false;
  const legal=legalFor(R.hands[0],R.trick);
  if(!legal.some(x=>same(x,c))){toast('باید خال '+SN[R.trick[0].c.s]+' بازی کنی');b.classList.add('shk');setTimeout(()=>b.classList.remove('shk'),320);return false}
  const r=R.resolve;R.sel=null;R.hint=null;r({c,rect:fromRect||b.getBoundingClientRect()});return true;
}
(function(){
  const el=$('#hand');let dr=null;
  el.addEventListener('pointerdown',e=>{const b=e.target.closest('.hc');if(!b||!G||!G.R||!G.R.resolve||G.R.turn!==0)return;dr={b,x:e.clientX,y:e.clientY,t:performance.now(),moved:false,lx:e.clientX,ly:e.clientY,lt:performance.now(),vy:0};try{b.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{if(!dr)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;
    if(!dr.moved&&Math.hypot(dx,dy)>10){dr.moved=true;dr.b.style.transition='none';dr.b.style.zIndex=80}
    if(dr.moved){const now=performance.now();dr.vy=(e.clientY-dr.ly)/Math.max(1,now-dr.lt);dr.lx=e.clientX;dr.ly=e.clientY;dr.lt=now;dr.b.style.transform='translate('+dx+'px,'+dy+'px) scale(1.12) rotate('+(dx/18)+'deg)'}});
  const end=e=>{if(!dr)return;const d=dr;dr=null;const dy=e.clientY-d.y;
    if(!d.moved){const R=G&&G.R;if(!R||!R.resolve||R.turn!==0)return;const c=R.hands[0].find(x=>x.s+x.r===d.b.dataset.k);if(R.sel&&c&&same(R.sel,c)){tryPlay(d.b)}else{if(c){const legal=legalFor(R.hands[0],R.trick);if(!legal.some(x=>same(x,c))){tryPlay(d.b);return}}R.sel=c;renderHand()}return}
    const rect=d.b.getBoundingClientRect();
    if((dy<-70||(dy<-25&&d.vy<-.8))&&tryPlay(d.b,rect))return;
    d.b.style.transition='';d.b.style.transform='';d.b.style.zIndex='';renderHand()};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',e=>{if(dr){dr.b.style.transition='';dr.b.style.transform='';dr=null;renderHand()}});
})();

/* ---------- menus ---------- */
function hint(){const R=G&&G.R;if(!R||!R.resolve||R.turn!==0){toast('وقتی نوبت توست');return}botChoose(0,G).then(c=>{R.hint=c;R.sel=c;renderHand();toast('پیشنهاد: '+RL(c.r)+' '+SYM[c.s])})}
function lastTrick(){const R=G&&G.R;if(!R||!R.last){toast('هنوز دستی تمام نشده');return}
  modal('<h2>دست قبلی</h2><div class="mh" style="height:auto;gap:8px;justify-content:center;flex-wrap:wrap">'+R.last.map(p=>'<div style="text-align:center">'+cardH(p.c)+'<div style="font-size:12px;margin-top:4px">'+esc(NAMES[p.s])+'</div></div>').join('')+'</div><div class="row"><button class="pill soft" id="m_c">بستن</button></div>',b=>$('#m_c',b).onclick=closeModal)}
function menu(){
  modal('<h2>منو</h2><div class="row"><button class="pill soft" id="m_r">ادامه</button></div><div class="row"><button class="pill soft" id="m_o">تنظیمات</button><button class="pill soft" id="m_u">قوانین</button></div><div class="row"><button class="pill soft" id="m_n">بازی تازه</button><button class="pill soft" id="m_h">خانه</button></div>',b=>{
    $('#m_r',b).onclick=closeModal;$('#m_o',b).onclick=settings;$('#m_u',b).onclick=rules;$('#m_n',b).onclick=newGame;$('#m_h',b).onclick=goHome})}
function settings(){
  const seg=(k,arr)=>'<div class="seg">'+arr.map(a=>'<button class="chip'+(ST.opts[k]===a[0]?' on':'')+'" data-k="'+k+'" data-v="'+a[0]+'">'+a[1]+'</button>').join('')+'</div>';
  modal('<h2>تنظیمات</h2><div class="set"><label>سطح بازی (ربات‌ها)</label>'+seg('level',LV.map(x=>[x[1],x[0]]))+'</div><div class="set"><label>سرعت ربات‌ها</label>'+seg('speed',[[.5,'سریع'],[1,'معمولی'],[1.7,'آهسته']])+'</div><div class="set"><label>امتیاز پایان بازی</label>'+seg('target',[[3,'3'],[5,'5'],[7,'7'],[11,'11']])+'</div><div class="set"><label>رنگ میز</label>'+seg('table',[['green','سبز'],['navy','سرمه‌ای'],['wine','زرشکی']])+'</div><div class="row"><button class="pill" id="m_c">تأیید</button></div>',b=>{
    $$('[data-k]',b).forEach(x=>x.onclick=()=>{const k=x.dataset.k;let v=x.dataset.v;if(k==='speed'||k==='target'||k==='level')v=+v;ST.opts[k]=v;if(k==='table')document.documentElement.dataset.table=v;save();$$('[data-k="'+k+'"]',b).forEach(y=>y.classList.toggle('on',y===x))});
    $('#m_c',b).onclick=()=>{closeModal();if(G&&!$('#game').hidden){}};
  });
}
function rules(){
  modal('<h2>قوانین حکم</h2><p>• چهار نفر در دو تیم بازی می‌کنند؛ تو و نیلوفر هم‌تیمی هستید.<br>• حاکم ۵ کارت اول را می‌بیند و خال حکم را انتخاب می‌کند؛ بعد بقیه‌ی کارت‌ها پخش می‌شود (هر نفر ۱۳ کارت).<br>• حاکم اولین دست را شروع می‌کند. باید خال کارت اول را بازی کنی؛ اگر نداری هر کارتی (مثلاً حکم برای بُریدن) می‌توانی بیاندازی.<br>• بالاترین حکم، یا اگر حکمی نبود بالاترین کارتِ هم‌خال، دست را می‌برد.<br>• هر تیم که ۷ دست یا بیشتر ببرد، آن دورِ بازی (دست) را برده و ۱ امتیاز می‌گیرد.<br>• بردن هر ۱۳ دست «کُت» است و ۲ امتیاز دارد؛ اگر تیمِ غیرِحاکم کُت کند ۳ امتیاز می‌گیرد.<br>• اگر تیم حاکم ببرد، حاکم همان می‌ماند؛ در غیر این صورت حاکمی به نفر بعدی می‌رسد.<br>• اولین تیمی که به امتیاز هدف برسد برنده است.<br>• برای بازی کردن یک کارت، یک‌بار روی آن بزن تا بالا بیاید و بار دوم بزن تا بازی شود.</p><div class="row"><button class="pill soft" id="m_c">بستن</button></div>',b=>$('#m_c',b).onclick=closeModal);
}
function goHome(){closeModal();G=null;$('#game').hidden=true;$('#home').hidden=false;renderHome()}
function renderHome(){
  const h=$('#home');
  h.innerHTML='<h1 class="ttl">حکم</h1><div class="suits"><i>♠</i><i class="r">♥</i><i>♣</i><i class="r">♦</i></div><div class="hm glass"><div class="set"><label>سطح بازی</label><div class="seg">'+LV.map(x=>'<button class="chip'+(ST.opts.level===x[1]?' on':'')+'" data-lv="'+x[1]+'">'+x[0]+'</button>').join('')+'</div></div><button class="pill" id="h_new">بازی تازه</button><button class="pill soft" id="h_set">تنظیمات</button><button class="pill soft" id="h_rul">قوانین</button></div><div class="hm glass" style="padding:14px"><div class="stt"><div><b>'+ST.games+'</b><small>بازی</small></div><div><b>'+ST.wins+'</b><small>برد</small></div><div><b>'+ST.rwins+'/'+ST.rounds+'</b><small>دست برده</small></div><div><b>'+ST.kots+'</b><small>کُت</small></div></div></div>';
  $$('[data-lv]',h).forEach(x=>x.onclick=()=>{ST.opts.level=+x.dataset.lv;save();$$('[data-lv]',h).forEach(y=>y.classList.toggle('on',y===x))});$('#h_new').onclick=newGame;$('#h_set').onclick=settings;$('#h_rul').onclick=rules;
}
(function(){const A=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.App;if(!A||!A.addListener)return;
  A.addListener('backButton',()=>{if(!$('#modal').hidden){closeModal();return}if(!$('#game').hidden){menu();return}if(A.exitApp)A.exitApp()})})();
renderHome();
})();

</script>
